spring.application.name=quanngon

# Logging: ghi console, cấu hình mức log qua biến môi trường và gắn mã request từ MDC.
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.ute.phuc.quanngon=${LOG_LEVEL_APP:INFO}
logging.level.ute.phuc.quanngon.logging.RequestLoggingFilter=${LOG_LEVEL_HTTP:INFO}
logging.pattern.level=%5p [requestId=%X{requestId:-none}]

server.address=0.0.0.0
server.port=${PORT:8080}

springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.override-with-generic-response=false

app.statistics.time-zone=${STATISTICS_TIME_ZONE:Asia/Ho_Chi_Minh}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

app.jwt.secret.access=${JWT_ACCESS_SECRET}
app.jwt.secret.refresh=${JWT_REFRESH_SECRET}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

app.security.cookie-secure=${APP_COOKIE_SECURE:false}
app.security.cookie-same-site=${APP_COOKIE_SAME_SITE:Lax}
app.security.require-https=${APP_REQUIRE_HTTPS:false}
app.security.https-port=443
app.security.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s

app.cache.categories-ttl-seconds=1800
app.cache.dashboard-ttl-seconds=60
app.cache.featured-eateries-ttl-seconds=300

otp.expiration-seconds=300

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=16MB
